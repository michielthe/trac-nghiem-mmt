<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm Mạng máy tính</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#17262e;--mute:#5d6f78;--line:#d5dee2;--acc:#0e6b73;--accbg:#e1f0f1;--ok:#1f7a45;--okbg:#e4f4ea;--bad:#b23a2e;--badbg:#fbe9e6}
:root[data-theme="dark"]{--bg:#10191d;--card:#18252b;--ink:#e7eff2;--mute:#9bb0b8;--line:#2d3f47;--acc:#4fc3cc;--accbg:#173a3e;--ok:#5fd18b;--okbg:#14301f;--bad:#ff8b7c;--badbg:#3a1c18}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191d;--card:#18252b;--ink:#e7eff2;--mute:#9bb0b8;--line:#2d3f47;--acc:#4fc3cc;--accbg:#173a3e;--ok:#5fd18b;--okbg:#14301f;--bad:#ff8b7c;--badbg:#3a1c18}}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chs{display:grid;gap:12px}
.ch{display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;width:100%}
.ch:hover{border-color:var(--acc)}
.ch b{display:block;font-size:1.05rem}
.ch span{color:var(--mute);font-size:.92rem}
.ch .n{margin-left:auto;font-weight:600;color:var(--acc);white-space:nowrap;font-size:.92rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.link{background:none;border:0;color:var(--acc);padding:6px 0;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.nav button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:.8rem;padding:0}
.nav button.cur{border:2px solid var(--acc);font-weight:700}
.nav button.ok{background:var(--okbg);color:var(--ok)}
.nav button.bad{background:var(--badbg);color:var(--bad)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.q h2{font-size:1.2rem;line-height:1.5;margin:0 0 18px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad .k{background:var(--bad);color:#fff}
.exp{margin-top:6px;padding:14px 16px;border-left:4px solid var(--acc);background:var(--accbg);border-radius:0 8px 8px 0}
.exp.ok{border-color:var(--ok)}.exp.bad{border-color:var(--bad)}
.exp strong{display:block;margin-bottom:2px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{border:1.5px solid var(--acc);background:var(--card);color:var(--acc);border-radius:8px;padding:10px 20px;font-weight:600}
.btn.p{background:var(--acc);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
.hint{color:var(--mute);font-size:.82rem;text-align:center;margin-top:16px}
.score{font-size:3rem;font-weight:700;color:var(--acc);margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
@media(max-width:520px){.q{padding:18px}.hint{display:none}}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.tg{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600;display:flex;align-items:center;gap:8px}
.tg i{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .2s}
.tg i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:left .2s}
.tg.on{border-color:var(--acc);color:var(--acc)}
.tg.on i{background:var(--acc)}.tg.on i:after{left:17px}
.ch.sel{border-color:var(--acc);background:var(--accbg)}
.go{margin-top:16px;width:100%;padding:14px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--bad);background:var(--badbg);border-radius:6px;padding:2px 10px;margin-bottom:10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// Mỗi câu: [câu hỏi, đáp án ĐÚNG, sai1, sai2, sai3, giải thích]
const CH=[
{t:"Chương 1 – Các khái niệm cơ bản",s:"Mạng, phân loại, độ trễ, chuyển mạch, đồ hình",q:[
["Internet là gì?","Mạng của mạng, có khả năng truy cập toàn cầu","Một máy chủ rất lớn đặt tại Mỹ","Mạng LAN của một công ty lớn","Một giao thức truyền tập tin","Internet là mạng của các mạng, kết nối vô số mạng nhỏ lại và cho phép truy cập trên phạm vi toàn cầu."],
["Loại mạng nào có tốc độ cao, ít lỗi, rẻ tiền và thuộc một tòa nhà/công ty?","LAN","MAN","WAN","Extranet","LAN có kích thước nhỏ, thuộc 1 tổ chức, nhanh, ít lỗi và rẻ. MAN và WAN chậm hơn, nhiều lỗi hơn, đắt hơn."],
["WAN khác LAN ở điểm nào?","Phạm vi quốc gia/quốc tế, thuộc nhiều đơn vị","Phạm vi một phòng máy, thuộc một công ty","Chỉ dùng cáp quang","Chỉ dùng trong một thành phố","WAN kết hợp nhiều LAN/MAN, phạm vi quốc gia, châu lục, quốc tế; chậm, nhiều lỗi và chi phí cao hơn LAN, MAN."],
["Viettel, FPT thuộc cấp ISP nào trong cấu trúc Internet?","Local ISP (cung cấp kết nối cho người dùng cuối)","Tier-1 ISP","Tier-2 ISP","Không thuộc ISP nào","Local ISP là nhà cung cấp kết nối cho người dùng cuối. Tier-1 là cấp quốc gia/quốc tế (AT&T, Sprint)."],
["Mạng nào cho phép bên ngoài truy cập vào nhưng phải qua chứng thực?","Extranet","Intranet","Internet","LAN","Intranet chỉ nội bộ, Extranet cho bên ngoài vào có chứng thực, Internet cho mọi người truy cập."],
["Mạng không dây được chia thành hai kiểu nào?","Infrastructure và Ad-hoc","Bus và Ring","LAN và WAN","Intranet và Extranet","Mạng không dây gồm kiểu Infrastructure (có thiết bị trung tâm) và Ad-hoc (các máy tự kết nối với nhau)."],
["ARPANET ngày 21/11/1969 kết nối hai nơi nào đầu tiên?","ĐH California Los Angeles và Viện nghiên cứu Stanford","MIT và Harvard","Stanford và MIT","ĐH California và Bell Labs","Đây là kết nối đầu tiên của ARPANET. ARPANET đóng năm 1990, NSFNET đóng năm 1995."],
["Ai là người phát minh công nghệ chuyển mạch gói?","Leonard Kleinrock","J.C.R. Licklider","Vinton Cerf","Robert Kahn","Kleinrock phát minh chuyển mạch gói. Licklider là người nêu ý tưởng đầu tiên về mạng máy tính."],
["Kiểu truyền nào gửi từ 1 node đến tất cả các node trong một vùng mạng?","Broadcast","Unicast","Multicast","Anycast","Broadcast: 1 → tất cả. Unicast: 1 → 1. Multicast: 1 → một nhóm. Anycast: 1 → một node bất kỳ trong nhóm."],
["Anycast khác Multicast thế nào?","Anycast gửi đến 1 node bất kỳ trong nhóm; Multicast gửi đến cả nhóm","Anycast gửi đến mọi node; Multicast gửi đến 1 node","Hai kiểu hoàn toàn giống nhau","Anycast chỉ dùng cho mạng không dây","Multicast: cả nhóm đều nhận. Anycast: chỉ một thành viên bất kỳ của nhóm nhận."],
["Giao thức (protocol) là gì?","Các quy định, quy tắc để trao đổi dữ liệu giữa các đối tượng trên mạng","Một loại cáp mạng","Một thiết bị chuyển tiếp dữ liệu","Một phần mềm diệt virus","Giao thức quy định định dạng dữ liệu, thứ tự gửi nhận và hành động sau mỗi thông điệp. VD: HTTP, TCP, IP, PPP."],
["Băng thông (bandwidth) và thông lượng (throughput) khác nhau thế nào?","Băng thông là mức lý tưởng; thông lượng là thực tế, thường nhỏ hơn","Băng thông là thực tế; thông lượng là lý thuyết","Hai khái niệm hoàn toàn giống nhau","Băng thông đo bằng giây, thông lượng đo bằng byte","Thông lượng bị ảnh hưởng bởi thiết bị liên mạng, topology, số user, máy của user và server nên nhỏ hơn băng thông."],
["Công thức tính trễ do tốc độ truyền (Dtrans) là gì?","L / R (độ dài gói / băng thông)","d / c (chiều dài đường truyền / tốc độ lan truyền)","R / L","L × R","Dtrans = L/R là thời gian đẩy cả gói lên đường truyền. d/c là trễ lan truyền Dprop."],
["Dprop = d/c thể hiện điều gì?","Thời gian để 1 bit đi từ nơi gửi đến nơi nhận","Thời gian gói chờ trong hàng đợi","Thời gian xử lý header ở router","Thời gian đẩy cả gói lên đường truyền","Dprop phụ thuộc khoảng cách và tốc độ lan truyền, không phụ thuộc kích thước gói."],
["Trong 4 thành phần của độ trễ, thành phần nào thường rất nhỏ?","Dproc (xử lý tại nút)","Dqueue (hàng đợi)","Dtrans","Dprop","Dproc chỉ là kiểm lỗi bit và xác định cổng ra nên thường rất nhỏ. Dqueue phụ thuộc số gói đến trước."],
["Gói tin 100 bytes, đường truyền 10 Mbps. Dtrans bằng bao nhiêu?","0,00008 s","0,0008 s","0,01 s","0,000008 s","L = 100×8 = 800 bit; R = 10×10^6 bps; Dtrans = 800 / 10^7 = 0,00008 s. Nhớ đổi byte sang bit."],
["Đặc điểm của chuyển mạch mạch (circuit switching) là gì?","Chiếm tài nguyên suốt cuộc gọi, đảm bảo không nghẽn","Chia dữ liệu thành gói dùng chung tài nguyên","Không cần thiết lập đường đi trước","Dùng hiệu quả băng thông với dữ liệu rời rạc","Chuyển mạch mạch (VD: mạng điện thoại PSTN) đặt trước đường đi và chiếm tài nguyên, nên lãng phí nếu dữ liệu rời rạc."],
["Nhược điểm của chuyển mạch gói là gì?","Có thể bị nghẽn và mỗi gói thêm header làm tăng kích thước dữ liệu","Phải đặt trước tài nguyên","Mỗi người dùng chiếm riêng một đường truyền","Chỉ phục vụ được một người dùng tại một thời điểm","Chuyển mạch gói cho nhiều người dùng đồng thời, dùng tài nguyên vừa đủ, nhưng có thể nghẽn và tốn thêm header."],
["Đồ hình mạng nào hỏng toàn mạng khi node trung tâm hỏng?","Star (sao)","Bus","Ring","Mesh","Star nối các node qua một node trung tâm: dễ quản lý nhưng điểm trung tâm hỏng thì cả mạng hỏng."],
["Đồ hình nào có độ tin cậy cao nhưng đắt vì tốn nhiều cáp?","Mesh (lưới)","Bus","Star","Ring","Mesh nối nhiều node với nhau nên dự phòng tốt, độ tin cậy cao, nhưng tốn cáp. Có mesh toàn phần và bán phần."],
["Firewall kiểm soát luồng dữ liệu theo hướng nào?","Cả từ trong ra ngoài và từ ngoài vào trong","Chỉ từ ngoài vào trong","Chỉ từ trong ra ngoài","Không kiểm soát luồng dữ liệu","Firewall (phần mềm/phần cứng) áp dụng Access Policy để cho phép hoặc chặn dữ liệu theo cả hai chiều."],
["Lệnh nào cho biết các chặng (router) trên đường đi đến đích?","tracert","ping","ipconfig","hosts","tracert hiển thị các chặng trên đường đi; ping đo thời gian phản hồi; pathping kết hợp cả hai."],
["Tốc độ truyền 360.000 km/h tương đương bao nhiêu km/s? Dprop trên đường dài 100 km là bao lâu?","100 km/s; Dprop = 1 s","360 km/s; Dprop ≈ 0,28 s","1000 km/s; Dprop = 0,1 s","10 km/s; Dprop = 10 s","Đổi km/h sang km/s bằng cách chia cho 3600: 360.000/3600 = 100 km/s. Dprop = d/c = 100/100 = 1 s.",1],
["Gói tin 1000 bytes gửi qua đường truyền 100 Mbps. Dtrans bằng bao nhiêu?","0,00008 s (80 µs)","0,0008 s","0,08 s","0,000008 s","L = 1000×8 = 8000 bit; R = 100×10^6 bps; Dtrans = 8000/10^8 = 8×10^-5 s = 80 µs. Hay sai: quên nhân 8 hoặc nhầm 1 Mbps = 10^6 bps.",1],
["Với Dproc = 0,01 s, Dqueue = 0, Dtrans = 0,00008 s, Dprop = 1 s, thời gian gửi 1 gói xấp xỉ bao nhiêu?","≈ 1,01 s","≈ 1,00008 s","≈ 0,01008 s","≈ 0,11 s","D = Dproc + Dqueue + Dtrans + Dprop = 0,01 + 0 + 0,00008 + 1 ≈ 1,01 s. Dprop chiếm gần hết vì đường dài.",1],
["Mạng mesh toàn phần gồm 6 máy cần tối thiểu bao nhiêu đường nối trực tiếp?","15","6","12","30","Mesh toàn phần: 2 thiết bị bất kỳ nối trực tiếp với nhau nên cần n(n−1)/2 = 6×5/2 = 15 đường. Đây là lý do mesh tốn nhiều cáp và đắt.",1]
]},
{t:"Chương 2 – Địa chỉ IP và chia subnet",s:"IPv4, subnet mask, đường mạng, broadcast, chia subnet",q:[
["Địa chỉ IPv4 có kích thước bao nhiêu?","32 bit (4 byte, 4 octet)","16 bit","48 bit","128 bit","IPv4 gồm 4 octet, mỗi octet 8 bit, ngăn cách bằng dấu chấm. IPv6 mới là 128 bit, MAC là 48 bit."],
["Địa chỉ IP và địa chỉ MAC lần lượt thuộc tầng nào trong mô hình OSI?","IP: tầng 3; MAC: tầng 2","IP: tầng 2; MAC: tầng 3","Cả hai thuộc tầng 3","IP: tầng 4; MAC: tầng 1","IP là địa chỉ logic (tầng Network). MAC là địa chỉ vật lý (tầng Data link)."],
["Địa chỉ MAC gồm bao nhiêu byte, 3 byte đầu là gì?","6 byte; 3 byte đầu là OUI do IEEE cấp cho nhà sản xuất","4 byte; 3 byte đầu do người dùng đặt","6 byte; 3 byte đầu do người dùng đặt","8 byte; 3 byte đầu là mã quốc gia","3 byte đầu (OUI) do IEEE ấn định cho nhà sản xuất, 3 byte sau do nhà sản xuất ấn định cho từng card mạng (NIC)."],
["Trong subnet mask, các bit thuộc NetID có giá trị nào?","Bằng 1","Bằng 0","Có thể là 0 hoặc 1","Luôn bằng 255","NetID bật 1, HostID là 0. Ví dụ /18 = 18 bit 1 liên tiếp = 255.255.192.0."],
["/24 tương ứng subnet mask nào?","255.255.255.0","255.255.0.0","255.255.255.128","255.0.0.0","/24 có 24 bit 1: ba octet đầu bằng 255, octet cuối bằng 0."],
["Cho 192.168.1.2/24. Địa chỉ đường mạng và broadcast là gì?","Net: 192.168.1.0; Broadcast: 192.168.1.255","Net: 192.168.0.0; Broadcast: 192.168.1.255","Net: 192.168.1.1; Broadcast: 192.168.1.254","Net: 192.168.1.0; Broadcast: 192.168.1.254","Net Addr: giữ NetID, xóa HostID về 0. Broadcast: giữ NetID, bật HostID lên 1."],
["Số host hợp lệ trong một đường mạng được tính bằng công thức nào?","2^m − 2 (m là số bit HostID)","2^m","2^n − 2 (n là số bit NetID)","2^m + 2","Trừ 2 vì địa chỉ đường mạng (HostID toàn 0) và broadcast (HostID toàn 1) không gán cho host."],
["172.29.1.1/16 có bao nhiêu host hợp lệ?","65.534","65.536","254","16","m = 32 − 16 = 16 nên số host = 2^16 − 2 = 65.534."],
["192.168.1.2 và 192.168.1.200 (mask /24) có cùng đường mạng không?","Có, cùng đường mạng 192.168.1.0","Không, vì khác host","Không, vì khác lớp địa chỉ","Chỉ cùng khi dùng broadcast","Hai node có cùng địa chỉ đường mạng thì thuộc cùng một đường mạng. Ở đây cả hai đều có Net Addr 192.168.1.0."],
["Địa chỉ 172.29.7.10 thuộc lớp nào, subnet mask mặc định là gì?","Lớp B, 255.255.0.0","Lớp A, 255.0.0.0","Lớp C, 255.255.255.0","Lớp B, 255.255.255.0","Octet đầu 128–191 là lớp B, mask mặc định /16. Net Addr là 172.29.0.0."],
["Dải 127.0.0.0 – 127.255.255.255 là loại địa chỉ gì?","Địa chỉ loopback","Địa chỉ public","Địa chỉ broadcast","Địa chỉ multicast","Loopback dùng để máy tự kiểm tra chính nó, không đi ra mạng ngoài."],
["Mục tiêu của việc chia subnet là gì?","Giảm số node mỗi mạng, tăng thông lượng/bảo mật, dễ quản trị, tránh lãng phí IP","Tăng số node trong mỗi mạng","Đổi địa chỉ MAC của máy","Làm địa chỉ IP dài hơn","Chia subnet giúp giảm node trong một mạng nên tăng thông lượng, dễ quản lý, bảo trì và đỡ lãng phí địa chỉ."],
["Mượn n bit từ phần HostID để chia subnet thì được bao nhiêu subnet?","2^n","n^2","2n","2^n − 2","Quy tắc: mượn các bit đầu của HostID làm NetID, số subnet = 2^n."],
["172.100.112.4/19 thuộc đường mạng nào?","172.100.96.0","172.100.112.0","172.100.64.0","172.100.0.0","Mask /19 = 255.255.224.0. Octet 3: 112 (0111 0000) AND 224 (1110 0000) = 0110 0000 = 96. Net = 172.100.96.0, broadcast = 172.100.127.255."],
["Chia 192.168.1.0/24 thành 4 subnet bằng nhau, subnet mask mới là gì?","255.255.255.192","255.255.255.128","255.255.255.224","255.255.255.240","4 subnet = 2^2 nên mượn 2 bit: /26 = 255.255.255.192. Các đường mạng: .0, .64, .128, .192."],

const app=document.getElementById('app');
let ch,qs,ans,idx;
const L='ABCD';
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

let cfg={shuf:false,all:false};
const total=ids=>ids.reduce((n,i)=>n+CH[i].q.length,0);
const hardN=ids=>ids.reduce((n,i)=>n+CH[i].q.filter(r=>r[6]).length,0);

function home(){
  const all=CH.map((_,i)=>i);
  app.innerHTML=`<h1>Trắc nghiệm Mạng máy tính</h1><p class="lead">Chọn một chương để ôn. Đáp án được xáo trộn mỗi lần làm, và giải thích luôn hiện sau khi bạn chọn. Câu có nhãn “Câu nâng cao” là phần tính toán hoặc chi tiết ít người để ý.</p>
  <div class="tools">
    <button class="tg ${cfg.shuf?'on':''}" id="tShuf" aria-pressed="${cfg.shuf}"><i></i>Xáo trộn thứ tự câu hỏi</button>
    <button class="tg ${cfg.all?'on':''}" id="tAll" aria-pressed="${cfg.all}"><i></i>Làm tất cả các chương</button>
  </div>
  <div class="chs">${CH.map((c,i)=>`<button class="ch ${cfg.all?'sel':''}" data-i="${i}"><div><b>${c.t}</b><span>${c.s}</span></div><span class="n">${c.q.length} câu · ${hardN([i])} nâng cao</span></button>`).join('')}</div>
  ${cfg.all?`<button class="btn p go" id="goAll">Bắt đầu làm tất cả (${total(all)} câu)</button>`:''}`;
  document.getElementById('tShuf').onclick=()=>{cfg.shuf=!cfg.shuf;home()};
  document.getElementById('tAll').onclick=()=>{cfg.all=!cfg.all;home()};
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>begin(cfg.all?all:[+b.dataset.i]));
  const g=document.getElementById('goAll');if(g)g.onclick=()=>begin(all);
}

function begin(ids){
  ch=ids.length>1?{t:'Tất cả các chương',ids}:{t:CH[ids[0]].t,ids};
  let rows=ids.flatMap(i=>CH[i].q);
  if(cfg.shuf)rows=shuf(rows);
  qs=rows.map(r=>({q:r[0],exp:r[5],h:r[6],o:shuf([{t:r[1],ok:1},{t:r[2]},{t:r[3]},{t:r[4]}])}));
  ans=qs.map(()=>null);idx=0;quiz();
}

function quiz(){
  const q=qs[idx],a=ans[idx],done=a!==null;
  const nDone=ans.filter(x=>x!==null).length;
  app.innerHTML=`
  <div class="top"><button class="link" id="back">← Chọn chương</button><span style="color:var(--mute);font-size:.9rem">Câu ${idx+1}/${qs.length}</span></div>
  <div class="bar"><i style="width:${nDone/qs.length*100}%"></i></div>
  <div class="nav">${qs.map((_,i)=>`<button data-i="${i}" class="${i===idx?'cur ':''}${ans[i]===null?'':qs[i].o[ans[i]].ok?'ok':'bad'}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>
  <section class="q">${q.h?'<span class="tag">Câu nâng cao</span>':''}<h2>${esc(q.q)}</h2>
  ${q.o.map((o,i)=>`<button class="opt ${done?(o.ok?'ok':i===a?'bad':''):''}" data-i="${i}" ${done?'disabled':''}><span class="k">${L[i]}</span><span>${esc(o.t)}</span></button>`).join('')}
  ${done?`<div class="exp ${q.o[a].ok?'ok':'bad'}"><strong>${q.o[a].ok?'Chính xác!':'Chưa đúng. Đáp án đúng là '+L[q.o.findIndex(o=>o.ok)]+'.'}</strong>${esc(q.exp)}</div>`:''}
  </section>
  <div class="foot"><button class="btn" id="prev" ${idx===0?'disabled':''}>← Câu trước</button>
  ${idx===qs.length-1?`<button class="btn p" id="fin">Xem kết quả</button>`:`<button class="btn p" id="next">Câu tiếp →</button>`}</div>
  <p class="hint">Dùng phím ← → để chuyển câu, phím 1–4 để chọn đáp án</p>`;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const p=document.getElementById('prev');p.onclick=()=>go(idx-1);
  const n=document.getElementById('next');if(n)n.onclick=()=>go(idx+1);
  const f=document.getElementById('fin');if(f)f.onclick=result;
}
function go(i){if(i>=0&&i<qs.length){idx=i;quiz();window.scrollTo(0,0)}}
function pick(i){if(ans[idx]===null){ans[idx]=i;quiz()}}

function result(){
  const ok=qs.filter((q,i)=>ans[i]!==null&&q.o[ans[i]].ok).length;
  const skip=ans.filter(x=>x===null).length;
  app.innerHTML=`<h1>Kết quả</h1><p class="lead">${ch.t}</p>
  <div class="score">${ok}/${qs.length}</div>
  <p>Đúng ${ok} câu, sai ${qs.length-ok-skip} câu${skip?`, chưa làm ${skip} câu`:''}.</p>
  <div class="row"><button class="btn p" id="again">Làm lại (đáp án xáo trộn)</button>${skip||ok<qs.length?'<button class="btn" id="rev">Xem lại bài</button>':''}<button class="btn" id="home">Chọn chương khác</button></div>`;
  document.getElementById('again').onclick=()=>begin(ch.ids);
  document.getElementById('home').onclick=home;
  const r=document.getElementById('rev');if(r)r.onclick=()=>{const w=ans.findIndex((a,i)=>a===null||!qs[i].o[a].ok);go(w<0?0:w)};
}

document.addEventListener('keydown',e=>{
  if(!qs||!document.querySelector('.q'))return;
  if(e.key==='ArrowRight')go(idx+1);
  else if(e.key==='ArrowLeft')go(idx-1);
  else if('1234'.includes(e.key)&&e.key.length===1)pick(+e.key-1);
});
home();
</script>
</body>
</html>
